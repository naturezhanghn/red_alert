name: Deploy Red Alert Frontline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html c2runtime.js data.js levels.json offlineClient.js jquery-2.1.1.min.js images media icon-*.png _site/
      - name: Validate static game bundle
        run: |
          test -s _site/index.html
          test -s _site/c2runtime.js
          test -s _site/data.js
          test -s _site/levels.json
          test -d _site/images
          test -d _site/media
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
